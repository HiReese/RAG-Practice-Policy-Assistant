[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rag-policy-assistant"
version = "0.1.0"
description = "Enterprise Policy Assistant (RAG)"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2",
]

[project.scripts]
parse = "src.ingestion.parser:main"
chunk = "src.ingestion.chunker:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
